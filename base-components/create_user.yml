---
- name: Create user access
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Fetch public key from SSM
      ansible.builtin.command:
        cmd: >
          aws ssm get-parameter
          --name devopswiki-infra-{{ env }}-yaw_public_key
          --with-decryption
          --query Parameter.Value
          --output text
          --region {{ region }}
      register: ssm_key
      changed_when: false

    - name: Fetch private key from SSM
      ansible.builtin.command:
        cmd: >
          aws ssm get-parameter
          --name devopswiki-infra-{{ env }}-yaw_priv_key
          --with-decryption
          --query Parameter.Value
          --output text
          --region {{ region }}
      register: ssm_priv_key
      changed_when: false

    - name: Create user yaw
      ansible.builtin.user:
        name: yaw
        shell: /bin/bash
        create_home: true

    - name: Create .ssh directory
      ansible.builtin.file:
        path: /home/yaw/.ssh
        state: directory
        owner: yaw
        group: yaw
        mode: "0700"

    - name: Add authorized key
      ansible.posix.authorized_key:
        user: yaw
        key: "{{ ssm_key.stdout }}"
        state: present

    - name: Write private key
      ansible.builtin.copy:
        dest: /home/yaw/.ssh/priv_key
        content: "{{ ssm_priv_key.stdout }}\n"
        owner: yaw
        group: yaw
        mode: "0600"

    - name: Grant passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/yaw
        content: "yaw ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
