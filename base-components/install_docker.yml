---
- name: Install Docker and Docker Compose
  hosts: localhost
  become: true

  tasks:
    - name: Install pip3
      ansible.builtin.package:
        name: python3-pip
        state: present

    - name: Install Docker
      ansible.builtin.package:
        name: docker
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add yaw to docker group
      ansible.builtin.user:
        name: yaw
        groups: docker
        append: true

    - name: Install Docker Compose via pip
      ansible.builtin.pip:
        name: docker-compose
        executable: pip3
        state: present
