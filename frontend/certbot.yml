---
- name: Setup Certbot and SSL Certificate
  hosts: localhost
  connection: local
  become: true

  vars:
    domain: test.devopswiki.info
    email: yawenochnartey@gmail.com
    s3_bucket: devops-wiki-letsencrypt-c9123c3a736c3547
    s3_path: testbed/letsencrypt
    cert_path: /etc/letsencrypt/live/{{ domain }}/fullchain.pem

  tasks:
    - name: Install certbot and cronie
      ansible.builtin.package:
        name:
          - certbot
          - cronie
        state: present

    - name: Enable and start crond
      ansible.builtin.systemd:
        name: crond
        enabled: true
        state: started

    - name: Restore letsencrypt from S3
      ansible.builtin.command:
        cmd: aws s3 cp s3://{{ s3_bucket }}/{{ s3_path }} /etc/letsencrypt --recursive --region eu-west-3
      failed_when: false
      changed_when: false

    - name: Check if certificate exists
      ansible.builtin.stat:
        path: "{{ cert_path }}"
      register: cert_file

    - name: Wait for DNS to propagate
      ansible.builtin.command:
        cmd: host {{ domain }}
      register: dns_check
      until: dns_check.rc == 0
      retries: 20
      delay: 15
      changed_when: false
      when: not cert_file.stat.exists

    - name: Run certbot to obtain certificate
      ansible.builtin.command:
        cmd: >
          certbot certonly --standalone
          -d {{ domain }}
          --non-interactive
          --agree-tos
          --email {{ email }}
      when: not cert_file.stat.exists

    - name: Backup new certificate to S3
      ansible.builtin.command:
        cmd: aws s3 cp /etc/letsencrypt s3://{{ s3_bucket }}/{{ s3_path }} --recursive --region eu-west-3
      when: not cert_file.stat.exists
      changed_when: true

    - name: Set up certbot auto-renewal cron
      ansible.builtin.cron:
        name: certbot renewal
        minute: "0"
        hour: "3"
        job: "certbot renew --quiet && /usr/local/bin/docker-compose -f /opt/app/docker-compose.yml restart frontend"
