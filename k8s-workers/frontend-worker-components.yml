- name: Setup frontend worker components
  hosts: localhost
  become: true

  tasks:
    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap on boot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '#\1'

    - name: Load br_netfilter module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Set sysctl parameters for Kubernetes networking
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
        reload: true
      loop:
        - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { name: net.ipv4.ip_forward, value: "1" }

    - name: Set SELinux to permissive immediately
      ansible.builtin.command: setenforce 0
      changed_when: false
      failed_when: false

    - name: Set SELinux to permissive on boot
      ansible.builtin.replace:
        path: /etc/selinux/config
        regexp: "^SELINUX=enforcing"
        replace: "SELINUX=permissive"

    - name: Install containerd
      ansible.builtin.package:
        name: containerd
        state: present

    - name: Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate default containerd config
      ansible.builtin.command: containerd config default
      register: containerd_config
      changed_when: false

    - name: Write containerd config
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_config.stdout }}"
        mode: "0644"

    - name: Enable SystemdCgroup in containerd config
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: "SystemdCgroup = false"
        replace: "SystemdCgroup = true"

    - name: Enable and restart containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: restarted

    - name: Add Kubernetes yum repository
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: https://pkgs.k8s.io/core:/stable:/v1.29/rpm/
        enabled: true
        gpgcheck: true
        gpgkey: https://pkgs.k8s.io/core:/stable:/v1.29/rpm/repodata/repomd.xml.key

    - name: Install kubelet, kubeadm and kubectl
      ansible.builtin.yum:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes

    - name: Enable and start kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

    - name: Set kubelet node label
      ansible.builtin.copy:
        dest: /etc/sysconfig/kubelet
        content: "KUBELET_EXTRA_ARGS=--node-labels=role=frontend\n"
        mode: "0644"

    - name: Wait for and fetch kubeadm join file from control plane
      ansible.builtin.command:
        cmd: >
          scp -i /home/yaw/.ssh/priv_key
          -o StrictHostKeyChecking=no
          yaw@{{ cp_private_ip }}:/home/yaw/kubeadm-join.txt
          /tmp/kubeadm-join.txt
      register: scp_result
      retries: 10
      delay: 20
      until: scp_result.rc == 0
      changed_when: false

    - name: Join the cluster
      ansible.builtin.command: bash /tmp/kubeadm-join.txt
      args:
        creates: /etc/kubernetes/kubelet.conf

    - name: Fetch kubeconfig from control plane
      ansible.builtin.command:
        cmd: >
          scp -i /home/yaw/.ssh/priv_key
          -o StrictHostKeyChecking=no
          yaw@{{ cp_private_ip }}:/home/yaw/.kube/config
          /tmp/admin.conf
      changed_when: false

    - name: Label node with frontend role
      ansible.builtin.command:
        cmd: kubectl label node {{ ansible_fqdn }} node-role.kubernetes.io/frontend=
      environment:
        KUBECONFIG: /tmp/admin.conf
      changed_when: true
